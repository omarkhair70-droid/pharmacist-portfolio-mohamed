<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b1625" />
  <title>THIS IS MY ROOM — Desktop Study 01</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="desktop" class="desktop" aria-label="Interactive desktop self portrait">
    <div class="wallpaper-noise" aria-hidden="true"></div>

    <section id="icons" class="icons" aria-label="Desktop icons">
      <button class="desktop-icon folder" data-id="room" style="--x:2;--y:2"><span class="glyph">📁</span><span>THE-ROOM...</span></button>
      <button class="desktop-icon system" data-id="pc" style="--x:2;--y:14"><span class="glyph">🖥️</span><span>This PC</span></button>
      <button class="desktop-icon app" data-id="tor" style="--x:8;--y:14"><span class="glyph">🟣</span><span>Tor Browser</span></button>
      <button class="desktop-icon app" data-id="vlc" style="--x:14;--y:14"><span class="glyph">🔶</span><span>VLC</span></button>
      <button class="desktop-icon folder" data-id="fokhara" style="--x:8;--y:52"><span class="glyph">📁</span><span>Fokhara</span></button>
      <button class="desktop-icon project" data-id="nova" style="--x:28;--y:52"><span class="glyph">📁</span><span>nova</span></button>
      <button class="desktop-icon project" data-id="wavezero" style="--x:20;--y:42"><span class="glyph">📄</span><span>wavezero-dev</span></button>
      <button class="desktop-icon app" data-id="blender" style="--x:2;--y:25"><span class="glyph">🌀</span><span>Blender 5.2</span></button>
      <button class="desktop-icon app" data-id="vscode" style="--x:14;--y:64"><span class="glyph">⌁</span><span>Visual Studio Code</span></button>
      <button class="desktop-icon app" data-id="github" style="--x:8;--y:64"><span class="glyph">◉</span><span>GitHub</span></button>
      <button class="desktop-icon photo" data-id="camera" style="--x:28;--y:4"><span class="glyph">🖼️</span><span>Camera Roll</span></button>
      <button class="desktop-icon doc" data-id="recorder" style="--x:20;--y:32"><span class="glyph">🎙️</span><span>recording_001</span></button>
      <button class="desktop-icon trash" data-id="trash" style="--x:2;--y:54"><span class="glyph">🗑️</span><span>Recycle Bin</span></button>
      <button class="desktop-icon folder" data-id="photos" style="--x:26;--y:56"><span class="glyph">👁️</span><span>Photos-1-001</span></button>
      <button class="desktop-icon app" data-id="obs" style="--x:8;--y:76"><span class="glyph">◌</span><span>OBS Studio</span></button>
      <button class="desktop-icon folder" data-id="film" style="--x:22;--y:76"><span class="glyph">📁</span><span>film-analysis</span></button>
    </section>

    <button id="omarIcon" class="desktop-icon omar-icon" aria-label="Open Omar">
      <span class="glyph">◻</span><span>OMAR</span>
    </button>

    <div id="glitchText" class="glitch-text" aria-hidden="true"></div>

    <section id="windowLayer" class="window-layer" aria-live="polite"></section>

    <footer class="taskbar" aria-label="Taskbar">
      <div class="taskbar-left">
        <button class="start-btn" aria-label="Start">⊞</button>
        <span class="task-app">⌕</span>
        <span class="task-app">▣</span>
        <span class="task-app">◉</span>
        <span class="task-app">⌁</span>
      </div>
      <div class="taskbar-right">
        <span>⌃</span><span>⌁</span><span>◌</span>
        <div class="clock"><strong>6:25 PM</strong><small>9/29/2026</small></div>
      </div>
    </footer>

    <button id="restart" class="restart" type="button">R — RESTART</button>
  </main>

  <noscript>This piece needs JavaScript.</noscript>
  <script src="./app.js"></script>
</body>
</html>
